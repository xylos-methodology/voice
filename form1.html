    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: url('workspace-bg.jpg') repeat;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .voice-header {
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            background: transparent;
            user-select: none;
            margin: 30px auto 0 auto;
            padding: 0 20px;
        }

        .pulse-line {
            background: transparent;
            padding: 12px 0;
            display: flex;
            align-items: center;
            border-bottom: 3px solid #1A1C1E;
        }

        .pulse-text {
            color: #1A1C1E;
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #B82E12;
            border-radius: 50%;
            margin-left: 10px;
            animation: blink-animation 1.5s infinite ease-in-out;
        }

        @keyframes blink-animation {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .steps-table {
            display: flex;
            width: 100%;
            justify-content: space-between;
            padding: 25px 0;
            box-sizing: border-box;
        }

        .step-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .step-cell .step-num {
            font-size: 13px;
            font-family: 'Roboto Mono', monospace;
            color: #1A1C1E;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .step-cell .step-title {
            font-family: 'Roboto Mono', monospace;
            font-size: 22px;
            color: #1A1C1E;
            opacity: 0.45;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .stamp-container {
            position: relative;
            display: inline-block;
        }

        .step-cell.passed .step-title {
            font-family: 'Oswald', sans-serif;
            font-size: 26px;
            color: #1A1C1E;
            opacity: 0.35;
            letter-spacing: -0.5px;
            filter: blur(0.3px);
        }

        .step-cell.passed .overlay-stamp {
            position: absolute;
            top: 15%;
            left: -5px;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            font-weight: 900;
            color: #B82E12;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 1px 4px;
            border: 1px solid #B82E12;
            transform: rotate(6deg);
            box-sizing: border-box;
            letter-spacing: 0px;
            mix-blend-mode: multiply;
        }

        .step-cell.passed .step-num {
            color: #1A1C1E;
            opacity: 0.35;
        }

        .step-cell.active .step-title {
            font-family: 'Oswald', sans-serif;
            font-size: 44px;
            font-weight: 700;
            text-transform: uppercase;
            color: #B82E12;
            opacity: 1;
            transform: rotate(-2deg);
            letter-spacing: -1px;
            display: inline-block;
            filter: none;
        }

        .step-cell.active .step-num {
            color: #B82E12;
            opacity: 1;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            padding: 5px 20px 40px 20px;
            box-sizing: border-box;
            margin: 0 auto;
        }

        .form-iframe-wrapper {
            width: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
        }

        .ya-b2b-iframe {
            width: 100%;
            min-height: 1850px;
            background: transparent;
            border: none;
            overflow: hidden;
        }

        @media (max-width: 600px) {
            .voice-header { padding: 0 10px; margin-top: 15px; }
            .pulse-text { font-size: 10px; letter-spacing: 1px; }
            .pulse-line { padding: 8px 0; }
            .steps-table { padding: 15px 0; }
            .step-cell .step-title { font-size: 16px; }
            .step-cell.active .step-title { font-size: 28px; }
            .step-cell .step-num { font-size: 10px; }
            .main-container { padding: 5px 10px 20px 10px; }
            .ya-b2b-iframe { min-height: 2200px; }
            .step-cell.passed .step-title { font-size: 16px; }
            .step-cell.passed .overlay-stamp { font-size: 8px; top: 5%; }
        }

        @media print {

                font-size: 14px;
                color: #B82E12;
                font-weight: bold;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100vh;
                text-align: center;
                padding: 40px;
            }

<body>

    <header class="voice-header">

            <span class="pulse-dot"></span>
        </div>
        <nav class="steps-table">
            <div class="step-cell passed">
                <span class="step-num">01</span>
                <div class="stamp-container">
                    <span class="step-title">ВИДЕТЬ</span>
                    <span class="overlay-stamp">ЗАФИКСИРОВАНО</span>
                </div>
            </div>
            <div class="step-cell active">
                <span class="step-num">02</span>
                <span class="step-title">ГОВОРИТЬ</span>
            </div>
            <div class="step-cell">
                <span class="step-num">03</span>

        </nav>
    </header>

    <main class="main-container">

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', function(e) {

                e.preventDefault();
