<script>
    (function() {
        // Точная ссылка на Мост №1
        const THANK_YOU_URL = 'https://xylos-methodology.github.io/voice/thank-you-1.html';
        
        // Получаем iframe с формой
        const iframe = document.querySelector('.ya-b2b-iframe');
        let isRedirecting = false;
        let checkInterval = null;

        function redirectToThankYou() {
            if (isRedirecting) return;
            isRedirecting = true;
            if (checkInterval) clearInterval(checkInterval);
            window.location.href = THANK_YOU_URL;
        }

        if (!iframe) return;

        // Запоминаем исходный URL формы
        const originalSrc = iframe.src;

        // Проверяем URL iframe каждые 300 мс
        checkInterval = setInterval(function() {
            try {
                // Пытаемся получить текущий URL iframe
                const currentUrl = iframe.contentWindow.location.href;
                
                // Если URL изменился и больше не содержит адрес формы Яндекса
                // (значит, форма обновилась после отправки)
                if (currentUrl !== originalSrc && !currentUrl.includes('forms.yandex.ru')) {
                    redirectToThankYou();
                }
            } catch (e) {
                // При кросс-доменной ошибке (которая возникает при смене URL)
                // мы также считаем, что форма отправлена
                redirectToThankYou();
            }
        }, 300);

        // Дополнительная страховка: если через 10 секунд ничего не сработало,
        // но пользователь уже нажал "Отправить" — мы не знаем об этом.
        // В таком случае ничего не делаем.
    })();
</script>
