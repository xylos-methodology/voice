<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чекап рутины // Хроники ночных переделок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="voice-header">
    <div class="pulse-line">
      <span class="pulse-text">НЕЗАВИСИМЫЙ АУДИТ КОММУНИКАЦИЙ // СТАТУС: LIVE</span>
      <span class="pulse-dot"></span>
    </div>
    <nav class="steps-table">
      <div class="step-cell passed">
        <span class="step-num">01</span>
        <div class="stamp-container">
          <span class="step-title">ВИДЕТЬ</span>
          <span class="overlay-stamp">ЗАФИКСИРОВАНО</span>
        </div>
      </div>
      <div class="step-cell active">
        <span class="step-num">02</span>
        <span class="step-title">ГОВОРИТЬ</span>
      </div>
      <div class="step-cell">
        <span class="step-num">03</span>
        <span class="step-title">ВЛИЯТЬ</span>
      </div>
    </nav>
  </header>

  <main class="main-container">
    <div class="form-iframe-wrapper">
      <iframe 
        src="https://forms.yandex.ru/cloud/6a636ae5e010db82edcfac10" 
        frameborder="0" 
        name="ya-form-1" 
        class="ya-b2b-iframe"
        scrolling="no">
      </iframe>
    </div>
  </main>

</body>
</html>
